name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy main after all checks pass (causes brief maintenance downtime)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        working-directory: backend

      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
        working-directory: backend

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: ci-secret-key
          DEBUG: 'true'
        run: pytest -v
        working-directory: backend

  containers:
    name: Build deployment images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [deploy/backend.Dockerfile, deploy/web.Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file '${{ matrix.dockerfile }}' .

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [test, frontend, containers]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    concurrency:
      group: academyjournal-production
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            set -eu
            cd /home/academy/AcademyJournal
            git fetch --prune origin
            runner="$(mktemp deploy/.deploy-runner.XXXXXX)"
            trap 'rm -f "$runner"' EXIT
            git show '${{ github.sha }}:deploy/deploy.sh' > "$runner"
            bash "$runner" '${{ github.sha }}'
